<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Decisions</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: var(--oc-font, system-ui, -apple-system, sans-serif);
        color: var(--oc-fg, #e6e9ef);
        background: transparent;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #root {
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      #root .oc-sdk-tabs {
        display: flex;
        width: 100%;
      }
      #root .oc-sdk-tab {
        flex: 1 1 0;
        justify-content: center;
      }
      #root .oc-sdk-trigger {
        width: 100%;
      }
      #root .oc-sdk-input[data-mono="true"] {
        font-size: 0.75rem;
        line-height: 1.4;
      }
      .gd-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .gd-title-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }
      .gd-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
      }
      .gd-actions {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }
      .gd-stack {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .gd-surface {
        background: var(--oc-elevated, rgba(128, 128, 128, 0.08));
        border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.2));
        border-radius: var(--oc-radius, 8px);
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }
      .gd-kv-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
      }
      .gd-stat {
        background: var(--oc-muted-surface, rgba(128, 128, 128, 0.06));
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        padding: 0.5rem 0.625rem;
        min-width: 0;
      }
      .gd-stat[data-wide="true"] {
        grid-column: 1 / -1;
      }
      .gd-stat-label {
        font-size: 0.72rem;
        color: var(--oc-muted, #8f96a6);
        margin-bottom: 0.15rem;
      }
      .gd-stat-value {
        font-size: 0.86rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gd-stat-value[data-mono="true"] {
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.76rem;
        font-weight: 500;
      }
      .gd-section-title {
        font-size: 0.82rem;
        font-weight: 600;
        line-height: 1.3;
        min-width: 0;
      }
      .gd-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .gd-action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.625rem;
      }
      .gd-answer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .gd-answer-key {
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.82rem;
        font-weight: 600;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gd-prob-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .gd-prob-row {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .gd-prob-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
        font-size: 0.76rem;
      }
      .gd-prob-name {
        font-family: var(--oc-mono, ui-monospace, monospace);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .gd-prob-name[data-winner="true"] {
        font-weight: 600;
        color: var(--oc-fg, #e6e9ef);
      }
      .gd-prob-num {
        font-variant-numeric: tabular-nums;
        color: var(--oc-muted, #8f96a6);
        flex-shrink: 0;
      }
      .gd-prob-num[data-winner="true"] {
        font-weight: 600;
        color: var(--oc-fg, #e6e9ef);
      }
      .gd-prob-track {
        height: 5px;
        border-radius: 9999px;
        background: color-mix(in srgb, var(--oc-fg, currentColor) 9%, transparent);
        overflow: hidden;
      }
      .gd-prob-fill {
        height: 100%;
        border-radius: 9999px;
        background: color-mix(in srgb, var(--oc-fg, currentColor) 24%, transparent);
        transition: width 160ms ease-out;
      }
      .gd-prob-fill[data-winner="true"] {
        background: var(--oc-primary, #4f86f7);
      }
      .gd-prob-fill[data-tone="success"] {
        background: var(--oc-success, #2fb375);
      }
      .gd-trace-list {
        display: flex;
        flex-direction: column;
      }
      .gd-trace-row {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding: 0.5rem 0;
        border-top: 1px solid color-mix(in srgb, var(--oc-border, rgba(128, 128, 128, 0.2)) 60%, transparent);
      }
      .gd-trace-row:first-child {
        padding-top: 0.25rem;
      }
      .gd-trace-row:last-child {
        padding-bottom: 0;
      }
      .gd-trace-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .gd-trace-summary {
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.75rem;
        line-height: 1.35;
        color: var(--oc-fg, #e6e9ef);
        word-break: break-word;
        min-width: 0;
      }
      .gd-trace-right {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        flex-shrink: 0;
      }
      .gd-trace-ms {
        font-size: 0.74rem;
        font-variant-numeric: tabular-nums;
        color: var(--oc-muted, #8f96a6);
      }
      .gd-trace-sub {
        font-size: 0.72rem;
        color: var(--oc-muted, #8f96a6);
      }
      .gd-code {
        margin: 0;
        padding: 0.5rem 0.625rem;
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        background: var(--oc-muted-surface, rgba(128, 128, 128, 0.1));
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.6875rem;
        line-height: 1.42;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .gd-subtle {
        font-size: 0.76rem;
        color: var(--oc-muted, #8f96a6);
        margin: 0;
        line-height: 1.38;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
